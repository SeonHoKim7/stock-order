spring:
  application:
    name: stock-order

  config:
    import: optional:classpath:secret-application.yml

  # 세션 저장소는 배포 환경의 속성이지 애플리케이션의 속성이 아니다.
  # spring-session-data-redis가 클래스패스에 있으면 Redis 세션 자동설정이 그대로 켜지므로,
  # 로컬(프로파일 없음)에서는 세션 자동설정 자체를 제외해 톰캣 인메모리 세션으로 돌린다.
  # 컨테이너 배포는 docker 프로파일(application-docker.yml)에서 이 제외를 걷어내 Redis 세션을 쓴다.
  # (Boot 3.0에서 spring.session.store-type이 제거되어 그 속성으로는 끌 수 없다)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false

  thymeleaf:
    cache: false

server:
  port: 8080

logging:
  level:
    com.stockandorder: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
