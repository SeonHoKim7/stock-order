# 컨테이너 배포 전용 프로파일.
# 기본 프로파일에서 제외해 둔 세션 자동설정을 여기서 되살려 Redis 세션을 사용한다.
# (Redis 호스트/포트는 docker-compose가 SPRING_DATA_REDIS_* 로 주입한다)
spring:
  autoconfigure:
    exclude:

  # 개발용 SQL 출력은 운영 로그에서 끈다.
  jpa:
    hibernate:
      # 비어있는 운영 DB의 테이블은 첫 기동 때 update로 만든다.
      # 첫 배포로 테이블이 생성되면 validate로 바꿔 재배포한다(이후 엔티티 변경이 운영 스키마를 몰래 바꾸지 못하게).
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  thymeleaf:
    cache: true

# application.yml의 DEBUG/TRACE를 덮어쓴다.
# 특히 jdbc.bind TRACE는 바인딩 파라미터 값(회원 비밀번호 해시 등)을 그대로 로그에 남기므로 운영에서 반드시 끈다.
logging:
  level:
    com.stockandorder: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
