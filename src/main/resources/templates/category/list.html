<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>카테고리 관리 - StockAndOrder</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/nav :: bar}"></div>

<h2>카테고리 관리</h2>


<div th:if="${message}" th:text="${message}" class="msg msg--ok"></div>

<!-- 카테고리 등록: 페이지 진입 시 바로 보이도록 목록 위 상단 카드에 한 줄 폼으로 배치 -->
<div sec:authorize="hasAnyRole('MANAGER', 'ADMIN')" class="card" style="margin-bottom:20px;">
    <form th:action="@{/categories}" th:object="${createForm}" method="post"
          style="display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; margin:0;">
        <div>
            <label>이름</label><br>
            <input type="text" th:field="*{name}" placeholder="카테고리 이름" required>
        </div>
        <div style="flex:1; min-width:220px;">
            <label>설명</label><br>
            <input type="text" th:field="*{description}" placeholder="설명 (선택)" style="width:100%;">
        </div>
        <button type="submit">+ 등록</button>
        <div style="flex-basis:100%;">
            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:var(--danger);"></span>
            <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" style="color:var(--danger);"></span>
        </div>
    </form>
</div>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>이름</th>
            <th>설명</th>
            <th>등록일</th>
            <th sec:authorize="hasAnyRole('MANAGER', 'ADMIN')"></th>
            <th sec:authorize="hasRole('ADMIN')"></th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="category : ${categories}">
            <td th:text="${category.categoryId}"></td>
            <td th:text="${category.name}"></td>
            <td th:text="${category.description}"></td>
            <td th:text="${#temporals.format(category.createdAt, 'yyyy-MM-dd')}"></td>
            <td sec:authorize="hasAnyRole('MANAGER', 'ADMIN')">
                <a th:href="@{/categories/{id}/edit(id=${category.categoryId})}">수정</a>
            </td>
            <td sec:authorize="hasRole('ADMIN')">
                <form th:action="@{/categories/{id}/delete(id=${category.categoryId})}" method="post"
                      style="display:inline;">
                    <button type="submit"
                            onclick="return confirm('삭제하시겠습니까? 상품이 있는 카테고리는 삭제할 수 없습니다.')">삭제</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(categories)}">
            <td colspan="6">등록된 카테고리가 없습니다.</td>
        </tr>
    </tbody>
</table>

</body>
</html>
